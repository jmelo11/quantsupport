[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "quantsupport"
description = "Derivative pricing and risk analytics (Rust core with Python bindings)."
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["pandas"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
typing = ["pandas-stubs", "typing-extensions>=4.15"]

[tool.maturin]
features = ["extension-module"]
module-name = "quantsupport.quantsupport"
python-source = "python"
