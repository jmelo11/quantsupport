[package]
name = "quantsupport-py"
version.workspace = true
edition = "2021"
description = "Python bindings for the quantsupport derivative pricing and risk analytics library."
license = "MIT"
repository = "https://github.com/jmelo11/quantsupport"
publish = false

[lib]
name = "quantsupport"
crate-type = ["cdylib", "rlib"]

[dependencies]
quantsupport = { path = "../.." }
pyo3 = { version = "0.29", features = ["multiple-pymethods"] }
pythonize = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
# Enabled by maturin when building the wheel; keeps `cargo test` linkable.
extension-module = ["pyo3/extension-module"]
