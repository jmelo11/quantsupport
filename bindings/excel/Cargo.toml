[package]
name = "quantsupport-xll"
version.workspace = true
edition = "2021"
description = "Excel XLL bindings for QuantSupport"
license = "MIT"
repository = "https://github.com/jmelo11/quantsupport"
publish = false

[[example]]
name = "function_catalog"
path = "tools/function_catalog.rs"

[[example]]
name = "validate_example_market"
path = "tools/validate_example_market.rs"

[lib]
name = "quantsupport_xll"
crate-type = ["cdylib", "rlib"]

[dependencies]
quantsupport = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
xll-rs = "0.1.1"
xllgen = "0.1.2"

[dev-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde_json = "1.0"
