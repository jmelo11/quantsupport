[package]
name = "quantsupport-xll"
version.workspace = true
edition = "2021"
description = "Excel XLL bindings for QuantSupport"
license = "MIT"
repository = "https://github.com/jmelo11/quantsupport"
publish = false

[lib]
name = "quantsupport_xll"
crate-type = ["cdylib", "rlib"]

[dependencies]
quantsupport = { path = "../.." }

[target.'cfg(windows)'.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xll-rs = "0.1.1"
xllgen = "0.1.2"

[dev-dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
