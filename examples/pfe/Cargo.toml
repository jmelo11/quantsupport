[package]
name = "pfe"
version = "0.1.0"
edition = "2021"
description = "PFE example for quantsupport"
license = "MIT"
repository = "https://github.com/jmelo11/quantsupport"
readme = "../../README.md"
keywords = ["finance"]
categories = ["finance"]
publish = false

[dependencies]
quantsupport = { path = "../../", features = ["plot"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "ttf", "all_series", "all_elements", "full_palette"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
