[package]
name = "benchmarks"
version = "0.1.0"
edition = "2021"
description = "Benchmarks for quantsupport"
license = "MIT"
repository = "https://github.com/jmelo11/quantsupport"
readme = "../README.md"
keywords = ["finance", "quant"]
categories = ["finance"]
publish = false

[dependencies]
quantsupport = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["prost-codec", "criterion"] }

[[bench]]
name = "swap_pfe"
harness = false

[[bench]]
name = "ad_core"
harness = false
