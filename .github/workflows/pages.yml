name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Release]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install binding documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Install checkout Python bindings for guide examples
        run: python -m pip install ./bindings/python
      - name: Test notebook kernel selection and execution
        run: python -m unittest discover -s bindings/python/examples -p test_run_notebooks.py -v
      - name: Test Book structure and navigation
        run: python -m unittest discover -s book/tests -v
      - name: Test binding reference generation
        run: python -m unittest discover -s docs/tests -v
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked
      - name: Install mdBook Mermaid
        run: cargo install mdbook-mermaid --version 0.17.0 --locked
      - name: Install Mermaid assets
        run: mdbook-mermaid install .
      - name: Build book
        run: mdbook build
      - name: Test Rust Book examples
        run: |
          cargo build -p quantsupport
          mdbook test -L target/debug/deps
      - name: Check Rust API reference
        run: RUSTDOCFLAGS='-D warnings' cargo doc -p quantsupport --no-deps
      - name: Build API reference
        run: sphinx-build -W -b html docs book/html/api
      - name: Stage Excel downloads
        run: |
          mkdir -p book/html/downloads
          gh release download --repo "$GITHUB_REPOSITORY" --pattern quantsupport.xll --dir book/html/downloads
          cp bindings/excel/examples/*.xlsx book/html/downloads/
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
