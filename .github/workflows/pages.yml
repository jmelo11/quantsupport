name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Release]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to deploy (blank selects latest)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Excel download staging
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select published release
        id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
        run: |
          python .github/scripts/excel_downloads.py resolve --repository "$GITHUB_REPOSITORY" \
            --run-id "$RELEASE_RUN_ID" --tag "$RELEASE_TAG"
          cp .github/scripts/excel_downloads.py "$RUNNER_TEMP/excel_downloads.py"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Check out released source
        if: steps.release.outputs.ref != ''
        run: git checkout --detach "$RELEASE_REF"
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install binding documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Install checkout Python bindings for guide examples
        run: python -m pip install ./bindings/python
      - name: Test notebook kernel selection and execution
        run: python -m unittest discover -s bindings/python/examples -p test_run_notebooks.py -v
      - name: Test Book structure and navigation
        run: python -m unittest discover -s book/tests -v
      - name: Test binding reference generation
        run: python -m unittest discover -s docs/tests -v
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked
      - name: Install mdBook Mermaid
        run: cargo install mdbook-mermaid --version 0.17.0 --locked
      - name: Install Mermaid assets
        run: mdbook-mermaid install .
      - name: Build book
        run: mdbook build
      - name: Test Rust Book examples
        run: python book/test_rust.py
      - name: Check Rust API reference
        run: RUSTDOCFLAGS='-D warnings' cargo doc -p quantsupport --no-deps
      - name: Build API reference
        run: sphinx-build -W -b html docs book/html/api
      - name: Stage Excel downloads
        if: steps.release.outputs.tag != ''
        run: |
          python "$RUNNER_TEMP/excel_downloads.py" stage --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --destination book/html/downloads --examples bindings/excel/examples
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
      - name: Configure Pages
        if: steps.release.outputs.tag != ''
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.release.outputs.tag != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/html

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
