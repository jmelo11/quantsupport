[workspace]
members = [
    ".",
    "examples/bootstrap",
    "examples/valuation/swaps",
    "examples/valuation/bonds",
    "examples/valuation/caps",
    "examples/valuation/loans",
    "examples/sensitivity",
    "examples/volatilitysurface",
    "examples/hullwhite",
    "examples/pfe",
    "examples/cva",
    "examples/scripting",
    "benchmarks",
    "bindings/python",
    "bindings/excel",
    "bindings/excel/macros",
]

[workspace.package]
version = "0.1.12"

[package]
name = "quantsupport"
version.workspace = true
edition = "2021"

license = "MIT"
repository = "https://github.com/jmelo11/quantsupport"
description = "Rust quantitative finance library for derivatives pricing, yield-curve bootstrapping, AAD risk, Monte Carlo exposure, and XVA."
keywords = [
    "quantitative-finance",
    "derivatives",
    "pricing",
    "yield-curve",
    "xva",
]
categories = ["finance", "science"]
documentation = "https://docs.rs/quantsupport"

[dependencies]
chrono = "0.4.37"
rayon = "1.7.0"
rand = "0.8.0"
sobol_burley = { version = "0.5.0", default-features = false }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
nalgebra = "0.34.1"
num-complex = "0.4"
num-traits = "0.2"
plotters = { version = "0.3", optional = true, default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "ttf", "all_series", "all_elements", "full_palette"] }

[dev-dependencies]
serde_json = "1.0.149"

[features]
default = []
plot = ["plotters"]

[lints.rust]
missing_docs = "forbid"
unreachable_patterns = "forbid"
unused_must_use = "forbid"
unused_import_braces = "forbid"
unconditional_recursion = "forbid"
unused_macro_rules = "forbid"
deprecated = "deny"

[lints.clippy]
unreadable_literal = "allow"
struct_excessive_bools = "allow"
missing_panics_doc = "deny"
should_panic_without_expect = "deny"
clone_on_copy = "forbid"
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
multiple_crate_versions = "allow" 
